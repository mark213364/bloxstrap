name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # важно: в проекте есть сабмодуль wpfui

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish (single file, win-x64)
        run: |
          dotnet publish -p:PublishSingleFile=true `
            -p:CommitHash=${{ github.sha }} `
            -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} `
            -r win-x64 `
            -c Release `
            --self-contained false `
            .\Bloxstrap\Bloxstrap.csproj

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-Build-${{ github.sha }}
          path: |
            .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\*
